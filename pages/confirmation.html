<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking Confirmation | SpeedyCar Rentals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f5f5f5;
    }

    .navbar-brand {
      font-weight: bold;
    }

    .section-title {
      margin-bottom: 30px;
    }

    .card {
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .form-section {
      margin-top: 40px;
    }

    .form-label {
      font-weight: 500;
    }

    .form-check-label {
      font-weight: 400;
    }

    .payment-methods {
      margin-top: 20px;
    }

    .toggle-btn {
      cursor: pointer;
    }

    .btn-confirm {
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">SpeedyCar Rentals</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="pages/suv.html">SUVs</a></li>
        <li class="nav-item"><a class="nav-link" href="pages/luxury.html">Luxury</a></li>
        <li class="nav-item"><a class="nav-link" href="pages/economy.html">Economy</a></li>
        <li class="nav-item"><a class="nav-link" href="pages/rent.html">Rent</a></li>
        <li class="nav-item"><a class="nav-link" href="pages/contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="pages/login.html">Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="container py-5">
  <h2 class="text-center section-title">Confirm & Complete Your Booking</h2>

  

  <!-- Customization Options -->
  <div class="card mb-4 p-4">
    <h5 class="mb-3">Customize Your Rental</h5>
    <form id="bookingForm">

      <!-- Color Selection -->
      <div class="mb-3">
        <label for="colorSelect" class="form-label">Preferred Color</label>
        <select class="form-select" id="colorSelect" required>
          <option selected disabled value="">Choose a color</option>
          <option>Black</option>
          <option>White</option>
          <option>Silver</option>
          <option>Blue</option>
          <option>Red</option>
        </select>
      </div>

      <!-- Fuel Type -->
      <div class="mb-3">
        <label class="form-label">Fuel Type</label>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="fuelType" id="gas" value="Gas" required>
          <label class="form-check-label" for="gas">Gas</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="fuelType" id="electric" value="Electric" required>
          <label class="form-check-label" for="electric">Electric</label>
        </div>
      </div>

      <!-- Model Year -->
      <div class="mb-3">
        <label for="yearSelect" class="form-label">Model Year</label>
        <select class="form-select" id="yearSelect" required>
          <option selected disabled value="">Select Year</option>
          <option>2023</option>
          <option>2022</option>
          <option>2021</option>
        </select>
      </div>

      <!-- ID Upload -->
      <div class="mb-3">
        <label for="idType" class="form-label">Form of Identification</label>
        <select class="form-select" id="idType" required>
          <option selected disabled value="">Select ID Type</option>
          <option>Passport</option>
          <option>Driver's License</option>
          <option>National ID</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="idUpload" class="form-label">Upload Your ID</label>
        <input class="form-control" type="file" id="idUpload" accept=".jpg,.jpeg,.png,.pdf" required>
      </div>

      <!-- Special Requests -->
      <div class="mb-3">
        <label for="specialRequests" class="form-label">Special Requests</label>
        <textarea class="form-control" id="specialRequests" rows="3" placeholder="Let us know if you need a car seat, special delivery, etc."></textarea>
      </div>

      <!-- Payment Options -->
      <div class="payment-methods mb-3">
        <label class="form-label">Payment Method</label>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="paymentMethod" id="cardOption" value="card" checked>
          <label class="form-check-label" for="cardOption">Credit/Debit Card</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="paymentMethod" id="paypalOption" value="paypal">
          <label class="form-check-label" for="paypalOption">PayPal</label>
        </div>
      </div>

      <!-- Card Form -->
      <div id="cardForm">
        <div class="row mb-3">
          <div class="col">
            <label for="cardName" class="form-label">Cardholder Name</label>
            <input type="text" class="form-control" id="cardName">
          </div>
          <div class="col">
            <label for="cardNumber" class="form-label">Card Number</label>
            <input type="text" class="form-control" id="cardNumber" pattern="\d{16}" maxlength="16">
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="expiry" class="form-label">Expiry Date</label>
            <input type="text" class="form-control" id="expiry" placeholder="MM/YY" pattern="\d{2}/\d{2}">
          </div>
          <div class="col">
            <label for="cvv" class="form-label">CVV</label>
            <input type="text" class="form-control" id="cvv" maxlength="3" pattern="\d{3}">
          </div>
        </div>
      </div>

      <!-- PayPal Note -->
      <div id="paypalInfo" class="mt-3 d-none">
        <div class="alert alert-info">You will be redirected to PayPal to complete the transaction securely.</div>
      </div>

      <button type="submit" class="btn btn-success btn-confirm w-100">Confirm Booking & Pay</button>
      <link rel="stylesheet" href="booking.html">
    </form>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const cardForm = document.getElementById('cardForm');
  const paypalInfo = document.getElementById('paypalInfo');

  document.getElementsByName('paymentMethod').forEach(method => {
    method.addEventListener('change', () => {
      if (document.getElementById('paypalOption').checked) {
        cardForm.classList.add('d-none');
        paypalInfo.classList.remove('d-none');
      } else {
        cardForm.classList.remove('d-none');
        paypalInfo.classList.add('d-none');
      }
    });
  });

  document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert("✅ Booking and Payment Confirmed! You will receive an email shortly.");
    window.location.href = "index.html";
  });
</script>

</body>
</html>
