<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxury Cars - SpeedyCar Rentals</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
  />
    <link rel="stylesheet" href="../style.css" />
    <style>
      body {
        background-color: #f8f9fa;
      }

      .card-img-top {
        object-fit: cover;
        height: 220px;
      }

      .card {
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s ease;
      }

      .card:hover {
        transform: scale(1.02);
      }

      .luxury-title {
        font-size: 2.5rem;
        font-weight: bold;
        color: #343a40;
      }

      footer {
        background-color: #333;
        color: white;
        padding: 20px 0;
      }

      footer p {
        margin: 0;
      }
    </style>
  </head>

  <body>

    <div id="navbar-placeholder"></div>

    <!-- Page Header -->
    <div class="container py-5">
      <h1 class="text-center luxury-title mb-4">Luxury Cars for Rent</h1>
      <p class="text-center text-muted mb-5">
        Experience the pinnacle of style, performance, and comfort. Explore our
        selection of high-end vehicles, perfect for special occasions or
        business travel.
      </p>
      <div class="row g-4" id="luxury-list"></div>

      
    </div>

    <!-- Footer -->
    <footer class="mt-5">
      <div class="container text-center">
        <p>&copy; 2025 SpeedyCar Rentals. All rights reserved.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../common/loadNavbar.js"></script>
    <script type="module" src="../scripts/cars.js"></script>
  </body>
</html>
